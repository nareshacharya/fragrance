# Docker Compose override for development
# This file is automatically loaded by docker-compose
# Use for development-specific overrides

version: '3.8'

services:
  # Development app configuration
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/fragrance_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - SESSION_SECRET=dev-session-secret-change-in-production
      - PEGA_API_URL=http://localhost:8080
      - PEGA_API_KEY=dev-pega-api-key
      - PEGA_CLIENT_ID=dev-pega-client-id
      - PEGA_CLIENT_SECRET=dev-pega-client-secret
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=dev@fragrance-management.local
      - LOG_LEVEL=debug
      - ENABLE_HOT_RELOAD=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "3000:3000"
    command: npm run dev

  # Development database with additional tools
  db:
    environment:
      - POSTGRES_DB=fragrance_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./scripts/dev-data.sql:/docker-entrypoint-initdb.d/dev-data.sql

  # Development Redis with persistence
  redis:
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Development Nginx with hot reload
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    command: nginx -g "daemon off;"

  # Development tools
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - fragrance-network
    restart: unless-stopped

  # Database backup service
  db-backup:
    image: postgres:15-alpine
    environment:
      - PGPASSWORD=password
    volumes:
      - ./backups:/backups
    command: |
      sh -c '
        while true; do
          pg_dump -h db -U postgres -d fragrance_dev > /backups/backup_$(date +%Y%m%d_%H%M%S).sql
          sleep 86400
        done
      '
    depends_on:
      - db
    networks:
      - fragrance-network
    restart: unless-stopped

  # Development file watcher
  file-watcher:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: |
      sh -c '
        npm install -g nodemon
        nodemon --watch src --ext ts,tsx,js,jsx --exec "echo File changed: $FILENAME"
      '
    networks:
      - fragrance-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
